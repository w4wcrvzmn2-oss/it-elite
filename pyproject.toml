[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "green-planner"
version = "0.1.0"
description = "Automatic green planting layout from DXF geobase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3.0",
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "httpx>=0.26.0",
    "reportlab>=4.0.0",
]

[project.scripts]
green-planner = "app.cli:app"
green-planner-api = "app.api.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
