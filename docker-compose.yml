services:
  backend:
    build: .
    image: green-planner
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  cli:
    profiles: ["cli"]
    build: .
    image: green-planner
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    command: >
      process
      --input /app/data/input/test.dxf
      --output /app/data/output/result.dxf
      --config /app/config/default.yaml
